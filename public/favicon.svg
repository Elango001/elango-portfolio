<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Dark Carbon Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171F"/>
      <stop offset="50%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>

    <!-- Electric Mint Gradient for E -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFC2"/>
      <stop offset="60%" stop-color="#20E7B7"/>
      <stop offset="100%" stop-color="#00C495"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Corner Ambient Lighting -->
    <radialGradient id="topGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#00FFC2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00FFC2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle with Dark Carbon Background -->
  <rect width="128" height="128" rx="34" fill="url(#bgGrad)"/>
  
  <!-- Subtle Internal Ambient Top Glow -->
  <rect width="128" height="128" rx="34" fill="url(#topGlow)"/>

  <!-- Sleek Mint Border Rim -->
  <rect x="2" y="2" width="124" height="124" rx="32" fill="none" stroke="#00FFC2" stroke-width="2.5" stroke-opacity="0.32"/>

  <!-- Subtle Inner Inset Border -->
  <rect x="5" y="5" width="118" height="118" rx="29" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.06"/>

  <!-- Custom Architectural Stencil Monogram 'E' -->
  <g filter="url(#softGlow)">
    <!-- Top Horizontal Bar -->
    <path d="M30 32 C30 27.58 33.58 24 38 24 H90 C94.42 24 98 27.58 98 32 C98 36.42 94.42 40 90 40 H38 C33.58 40 30 36.42 30 32 Z" fill="url(#mintGrad)"/>

    <!-- Vertical Spine connecting Top to Bottom -->
    <path d="M30 32 H46 V96 H30 C25.58 96 22 92.42 22 88 V40 C22 35.58 25.58 32 30 32 Z" fill="url(#mintGrad)"/>

    <!-- Middle Horizontal Kinetic Bar (Slightly Shortened with Accent Cut) -->
    <path d="M38 56 H76 C80.42 56 84 59.58 84 64 C84 68.42 80.42 72 76 72 H38 C33.58 72 30 68.42 30 64 C30 59.58 33.58 56 38 56 Z" fill="url(#mintGrad)"/>

    <!-- Bottom Horizontal Bar -->
    <path d="M30 96 C30 91.58 33.58 88 38 88 H90 C94.42 88 98 91.58 98 96 C98 100.42 94.42 104 90 104 H38 C33.58 104 30 100.42 30 96 Z" fill="url(#mintGrad)"/>

    <!-- Forward Cybernetic Dot Accent -->
    <circle cx="94" cy="64" r="5" fill="#00FFC2" opacity="0.95"/>
  </g>
</svg>
